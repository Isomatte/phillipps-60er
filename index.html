<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Philipp wird 60</title>
<meta name="description" content="Philipp wird 60 – schön, dass ihr mitfeiert! Das Lied des Abends: blink-182 – What's My Age Again?">
<meta property="og:title" content="Philipp wird 60">
<meta property="og:description" content="Schön, dass ihr mitfeiert! Hier gibt’s das Lied des Abends.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://phillipps-60er.de/">
<meta property="og:image" content="https://phillipps-60er.de/philipp.jpg">
<meta name="theme-color" content="#1b1411">
<style>
  :root {
    --bg: #1b1411;
    --bg-2: #2a1d17;
    --ink: #f6ebe0;
    --muted: #c8b4a2;
    --gold: #e2b56b;
    --gold-2: #f3d69a;
    --ember: #c8643c;
    --card: rgba(255, 240, 225, 0.06);
    --line: rgba(255, 230, 200, 0.14);
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100svh;
    background:
      radial-gradient(120% 70% at 50% -10%, rgba(226, 181, 107, 0.22), transparent 60%),
      radial-gradient(90% 60% at 100% 100%, rgba(200, 100, 60, 0.18), transparent 60%),
      var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    display: flex;
    justify-content: center;
    padding: max(24px, env(safe-area-inset-top)) 20px max(32px, env(safe-area-inset-bottom));
  }
  main {
    width: 100%;
    max-width: 440px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  /* Konfetti-Funken im Hintergrund – dezent */
  .sparks { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
  .sparks i {
    position: absolute; top: -10px; width: 4px; height: 4px; border-radius: 50%;
    background: var(--gold-2); opacity: 0;
    animation: fall linear infinite;
  }
  @keyframes fall {
    0%   { transform: translateY(0) translateX(0); opacity: 0; }
    10%  { opacity: .55; }
    100% { transform: translateY(105vh) translateX(var(--drift, 20px)); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) { .sparks { display: none; } }

  main > * { position: relative; z-index: 1; }

  .eyebrow {
    margin: 8px 0 0;
    font-size: 12px;
    letter-spacing: .32em;
    text-transform: uppercase;
    color: var(--gold);
  }

  .photo {
    margin: 22px 0 0;
    width: min(72vw, 280px);
    aspect-ratio: 4 / 5;
    border-radius: 999px 999px 24px 24px;
    overflow: hidden;
    position: relative;
    box-shadow:
      0 0 0 1px var(--line),
      0 0 0 8px rgba(226, 181, 107, 0.08),
      0 30px 60px -20px rgba(0, 0, 0, 0.7);
  }
  .photo img {
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: 45% 40%;
    display: block;
  }
  /* Diashow über dem Startfoto – läuft synchron zum Lied */
  .slides { position: absolute; inset: 0; }
  .slide {
    position: absolute; inset: 0; overflow: hidden;
    opacity: 0; transition: opacity 1.2s ease;
  }
  .slide.on { opacity: 1; }
  .slide .blur {
    position: absolute; inset: -24px;
    background-size: cover; background-position: center;
    filter: blur(18px) brightness(.5) saturate(1.1);
  }
  .photo .slide img {
    position: relative;
    object-fit: contain; object-position: center;
    transform-origin: center;
  }
  .slide.on img, .slide.out img { animation: kenburns 7s ease-out forwards; }
  @keyframes kenburns { from { transform: scale(1); } to { transform: scale(1.07); } }
  @media (prefers-reduced-motion: reduce) {
    .slide { transition-duration: .3s; }
    .slide.on img, .slide.out img { animation: none; }
  }

  .badge {
    position: relative;
    margin-top: -34px;
    width: 68px; height: 68px;
    border-radius: 50%;
    display: grid; place-items: center;
    background: linear-gradient(145deg, var(--gold-2), var(--gold) 55%, #b98340);
    color: #2a1a0e;
    font-family: var(--serif);
    font-weight: 700;
    font-size: 28px;
    box-shadow: 0 10px 24px -8px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.5);
    border: 3px solid var(--bg);
  }

  h1 {
    margin: 18px 0 6px;
    font-family: var(--serif);
    font-weight: 400;
    font-size: clamp(34px, 10vw, 46px);
    line-height: 1.08;
    letter-spacing: -0.01em;
  }
  h1 em {
    font-style: italic;
    background: linear-gradient(90deg, var(--gold-2), var(--gold), var(--ember));
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
  }
  .sub {
    margin: 0;
    color: var(--muted);
    font-size: 16px;
    line-height: 1.5;
    max-width: 30ch;
  }

  /* Player */
  .player {
    margin-top: 28px;
    width: 100%;
    padding: 22px 20px 20px;
    border-radius: 24px;
    background: var(--card);
    border: 1px solid var(--line);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
  }
  .track { display: flex; flex-direction: column; gap: 2px; margin-bottom: 18px; }
  .track .label {
    font-size: 11px; letter-spacing: .24em; text-transform: uppercase; color: var(--gold);
  }
  .track .title {
    font-family: var(--serif); font-size: 22px; line-height: 1.25;
  }
  .track .artist { color: var(--muted); font-size: 15px; }

  .play {
    -webkit-appearance: none; appearance: none;
    border: 0; padding: 0; cursor: pointer;
    width: 96px; height: 96px; border-radius: 50%;
    display: grid; place-items: center;
    margin: 0 auto;
    color: #2a1a0e;
    background: radial-gradient(circle at 35% 30%, var(--gold-2), var(--gold) 55%, #b5793a);
    box-shadow:
      0 18px 36px -12px rgba(226, 150, 70, 0.6),
      inset 0 1px 0 rgba(255,255,255,.55),
      inset 0 -6px 12px rgba(120, 60, 20, .25);
    transition: transform .15s ease, box-shadow .2s ease;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    position: relative;
  }
  .play:active { transform: scale(.95); }
  .play:focus-visible { outline: 3px solid var(--gold-2); outline-offset: 5px; }
  .play svg { width: 38px; height: 38px; display: block; }
  .play .i-pause { display: none; }
  .play.is-playing .i-play { display: none; }
  .play.is-playing .i-pause { display: block; }
  .play::after {
    content: ""; position: absolute; inset: -8px; border-radius: 50%;
    border: 2px solid var(--gold); opacity: 0;
  }
  .play.is-playing::after { animation: pulse 1.8s ease-out infinite; }
  @keyframes pulse {
    0% { transform: scale(.92); opacity: .55; }
    100% { transform: scale(1.18); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) { .play.is-playing::after { animation: none; } }
  .play.is-loading .i-play { opacity: .4; }

  .progress {
    margin-top: 24px;
    padding: 12px 0;           /* großzügige Touch-Fläche */
    cursor: pointer;
    touch-action: none;
  }
  .bar {
    position: relative; height: 6px; border-radius: 6px;
    background: rgba(255, 235, 210, 0.14);
  }
  .fill {
    position: absolute; inset: 0 auto 0 0; width: 0%;
    border-radius: inherit;
    background: linear-gradient(90deg, var(--ember), var(--gold));
  }
  .knob {
    position: absolute; top: 50%; left: 0%;
    width: 18px; height: 18px; margin: -9px 0 0 -9px;
    border-radius: 50%; background: var(--gold-2);
    box-shadow: 0 2px 8px rgba(0,0,0,.45);
    transition: transform .12s ease;
  }
  .progress:active .knob { transform: scale(1.25); }
  .progress:focus-visible { outline: 2px solid var(--gold-2); outline-offset: 4px; border-radius: 8px; }
  .times {
    display: flex; justify-content: space-between;
    font-size: 13px; color: var(--muted);
    font-variant-numeric: tabular-nums;
    margin-top: 2px;
  }

  .note {
    margin: 28px 0 0;
    font-family: var(--serif);
    font-style: italic;
    color: var(--muted);
    font-size: 17px;
    line-height: 1.5;
    max-width: 32ch;
  }
  footer {
    margin-top: 28px;
    font-size: 12px; letter-spacing: .2em; text-transform: uppercase;
    color: rgba(200, 180, 162, .6);
  }
</style>
</head>
<body>
<div class="sparks" aria-hidden="true"></div>

<main>
  <p class="eyebrow">Willkommen zur Feier</p>

  <div class="photo">
    <img src="philipp.jpg" alt="Philipp" width="1461" height="1162" decoding="async">
    <div class="slides" aria-hidden="true">
      <div class="slide"><div class="blur"></div><img alt="" decoding="async"></div>
      <div class="slide"><div class="blur"></div><img alt="" decoding="async"></div>
    </div>
  </div>
  <div class="badge" aria-hidden="true">60</div>

  <h1><em>Philipp</em><br>wird 60</h1>
  <p class="sub">Schön, dass ihr da seid! Hier ist das Lied des Abends – es stellt die wichtigste Frage des Tages.</p>

  <section class="player" aria-label="Musikplayer">
    <div class="track">
      <span class="label">Das Lied des Abends</span>
      <span class="title">What's My Age Again?</span>
      <span class="artist">blink-182</span>
    </div>

    <button class="play" id="play" type="button" aria-label="Abspielen">
      <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8 5.5v13a1 1 0 0 0 1.5.86l10.4-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>
      <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4.2" height="14" rx="1.3" fill="currentColor"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.3" fill="currentColor"/></svg>
    </button>

    <div class="progress" id="progress" role="slider" tabindex="0"
         aria-label="Wiedergabeposition" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="bar"><div class="fill" id="fill"></div><div class="knob" id="knob"></div></div>
    </div>
    <div class="times"><span id="cur">0:00</span><span id="dur">–:––</span></div>

    <audio id="audio" src="lied.mp3" preload="metadata"></audio>
  </section>

  <p class="note">Spoiler: Es ist 60. Aber das glaubt mir sowieso keiner.</p>

  <footer>Danke, dass ihr mitfeiert</footer>
</main>

<script>
(function () {
  var audio = document.getElementById('audio');
  var btn = document.getElementById('play');
  var prog = document.getElementById('progress');
  var fill = document.getElementById('fill');
  var knob = document.getElementById('knob');
  var cur = document.getElementById('cur');
  var dur = document.getElementById('dur');
  var dragging = false;

  function fmt(s) {
    if (!isFinite(s)) return '–:––';
    s = Math.max(0, Math.floor(s));
    return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  }
  function setPos(ratio) {
    var p = Math.min(1, Math.max(0, ratio)) * 100;
    fill.style.width = p + '%';
    knob.style.left = p + '%';
    prog.setAttribute('aria-valuenow', Math.round(p));
  }
  function render() {
    if (dragging) return;
    var d = audio.duration;
    setPos(d ? audio.currentTime / d : 0);
    cur.textContent = fmt(audio.currentTime);
    prog.setAttribute('aria-valuetext', fmt(audio.currentTime) + ' von ' + fmt(d));
  }
  function setPlaying(on) {
    btn.classList.toggle('is-playing', on);
    btn.setAttribute('aria-label', on ? 'Pause' : 'Abspielen');
  }

  btn.addEventListener('click', function () {
    if (audio.paused) {
      btn.classList.add('is-loading');
      var p = audio.play();
      if (p && p.catch) p.catch(function () { btn.classList.remove('is-loading'); setPlaying(false); });
    } else {
      audio.pause();
    }
  });

  audio.addEventListener('playing', function () { btn.classList.remove('is-loading'); setPlaying(true); });
  audio.addEventListener('pause', function () { setPlaying(false); });
  audio.addEventListener('ended', function () { setPlaying(false); audio.currentTime = 0; render(); showSlide(-1); });
  audio.addEventListener('timeupdate', render);

  // Diashow: Bild-Index folgt der Liedposition (dia/01.jpg … dia/45.jpg)
  var SLIDE_COUNT = 45;
  var slideEls = document.querySelectorAll('.slide');
  var shown = -1, front = 0, cache = {};
  function slideSrc(i) { return 'dia/' + String(i + 1).padStart(2, '0') + '.jpg'; }
  function preload(i) {
    if (i < 0 || i >= SLIDE_COUNT || cache[i]) return;
    cache[i] = new Image(); cache[i].src = slideSrc(i);
  }
  function showSlide(i) {
    if (i === shown) return;
    shown = i;
    if (i < 0) { slideEls.forEach(function (el) { if (el.classList.contains('on')) el.classList.replace('on', 'out'); }); return; }
    var next = slideEls[1 - front], prev = slideEls[front];
    var img = next.querySelector('img'), src = slideSrc(i);
    var reveal = function () {
      if (shown !== i) return;
      next.classList.remove('out'); void next.offsetWidth;
      next.classList.add('on');
      if (prev.classList.contains('on')) prev.classList.replace('on', 'out');
      front = 1 - front;
    };
    next.classList.remove('on', 'out');
    next.querySelector('.blur').style.backgroundImage = 'url("' + src + '")';
    img.onload = reveal;
    img.src = src;
    if (img.complete && img.naturalWidth) reveal();
    preload(i + 1); preload(i + 2);
  }
  function syncSlides() {
    var d = audio.duration;
    if (!d || (audio.paused && audio.currentTime === 0)) { showSlide(-1); return; }
    showSlide(Math.min(SLIDE_COUNT - 1, Math.floor(audio.currentTime / d * SLIDE_COUNT)));
  }
  audio.addEventListener('timeupdate', syncSlides);
  audio.addEventListener('seeked', syncSlides);
  audio.addEventListener('play', function () { preload(0); preload(1); });
  audio.addEventListener('loadedmetadata', function () { dur.textContent = fmt(audio.duration); render(); });
  audio.addEventListener('durationchange', function () { dur.textContent = fmt(audio.duration); });

  function ratioAt(e) {
    var r = prog.getBoundingClientRect();
    return (e.clientX - r.left) / r.width;
  }
  function seekTo(ratio) {
    if (!audio.duration) return;
    audio.currentTime = Math.min(1, Math.max(0, ratio)) * audio.duration;
  }
  prog.addEventListener('pointerdown', function (e) {
    if (!audio.duration) return;
    dragging = true;
    prog.setPointerCapture(e.pointerId);
    var r = ratioAt(e); setPos(r); cur.textContent = fmt(r * audio.duration);
  });
  prog.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    var r = Math.min(1, Math.max(0, ratioAt(e)));
    setPos(r); cur.textContent = fmt(r * audio.duration);
  });
  function endDrag(e) {
    if (!dragging) return;
    dragging = false;
    seekTo(ratioAt(e));
  }
  prog.addEventListener('pointerup', endDrag);
  prog.addEventListener('pointercancel', function () { dragging = false; render(); });
  prog.addEventListener('keydown', function (e) {
    if (!audio.duration) return;
    var step = { ArrowRight: 5, ArrowUp: 5, ArrowLeft: -5, ArrowDown: -5 }[e.key];
    if (step) { e.preventDefault(); audio.currentTime = Math.min(audio.duration, Math.max(0, audio.currentTime + step)); }
  });

  // Autoplay versuchen – klappt meist nicht (v. a. iOS), dann bleibt der Button
  var tryAuto = audio.play();
  if (tryAuto && tryAuto.catch) tryAuto.catch(function () { setPlaying(false); });

  // dezente Funken
  var sparks = document.querySelector('.sparks');
  for (var i = 0; i < 18; i++) {
    var s = document.createElement('i');
    s.style.left = (Math.random() * 100) + '%';
    s.style.animationDuration = (9 + Math.random() * 10) + 's';
    s.style.animationDelay = (-Math.random() * 18) + 's';
    s.style.setProperty('--drift', (Math.random() * 60 - 30) + 'px');
    var size = 2 + Math.random() * 3;
    s.style.width = s.style.height = size + 'px';
    sparks.appendChild(s);
  }
})();
</script>
</body>
</html>
