<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Philipp 60</title>
<meta name="description" content="Philipp wird 60.">
<meta property="og:title" content="Philipp 60">
<meta property="og:description" content="Philipp wird 60.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://phillipps-60er.de/">
<meta property="og:image" content="https://phillipps-60er.de/philipp.jpg">
<meta name="theme-color" content="#0f0f0f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0f0f;
    --ink: #f1f0ec;
    --muted: #85837d;
    --line: #2a2a28;
    --font: "Archivo", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100svh;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
    display: flex;
    justify-content: center;
    padding: max(28px, env(safe-area-inset-top)) 16px max(32px, env(safe-area-inset-bottom));
  }
  main {
    width: 100%;
    max-width: 480px;
    margin: auto 0;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  h1 {
    margin: 0;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-weight: 800;
    font-size: clamp(44px, 15vw, 68px);
    line-height: .9;
    letter-spacing: -0.035em;
    text-transform: uppercase;
  }
  h1 span { color: var(--muted); font-weight: 500; }

  /* Foto / Diashow */
  .photo {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 3;
    background: var(--bg);
    overflow: hidden;
  }
  .photo img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: contain;
    display: block;
  }
  .photo > img { object-fit: cover; object-position: 50% 35%; }
  .slide {
    position: absolute; inset: 0;
    background: var(--bg);
    opacity: 0; transition: opacity 1.4s ease;
  }
  .slide.on { opacity: 1; }
  .slide:not(.on) { pointer-events: none; }
  .info {
    display: flex; flex-direction: column; justify-content: center;
    padding: 0 8%;
    border: 1px solid var(--line);
  }
  .info .label {
    font-size: 12px; letter-spacing: .2em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 14px;
  }
  .info .date {
    font-weight: 800; font-size: clamp(40px, 13vw, 60px);
    line-height: .95; letter-spacing: -0.03em;
  }
  .info .time { font-size: clamp(18px, 5vw, 22px); color: var(--muted); margin-top: 6px; }
  .info .place { margin-top: 22px; font-size: clamp(17px, 4.6vw, 20px); line-height: 1.3; }
  .info .place a { color: inherit; text-decoration: none; border-bottom: 1px solid var(--muted); }
  .info .place span { color: var(--muted); }
  @media (prefers-reduced-motion: reduce) { .slide { transition-duration: .3s; } }

  /* Player */
  .player { display: flex; flex-direction: column; gap: 14px; }
  .row { display: flex; align-items: center; gap: 14px; }
  .play {
    -webkit-appearance: none; appearance: none;
    flex: none;
    width: 52px; height: 52px; border-radius: 50%;
    border: 0; padding: 0; cursor: pointer;
    display: grid; place-items: center;
    background: var(--ink); color: var(--bg);
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    transition: transform .12s ease;
  }
  .play:active { transform: scale(.94); }
  .play:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }
  .play svg { width: 20px; height: 20px; display: block; }
  .play .i-pause { display: none; }
  .play.is-playing .i-play { display: none; }
  .play.is-playing .i-pause { display: block; }
  .play.is-loading { opacity: .6; }

  .track { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 2px; }
  .track .title { font-size: 16px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track .artist { font-size: 14px; color: var(--muted); }
  .times {
    flex: none;
    font-size: 13px; color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  .progress {
    padding: 10px 0;
    cursor: pointer;
    touch-action: none;
  }
  .bar { position: relative; height: 2px; background: var(--line); }
  .fill { position: absolute; inset: 0 auto 0 0; width: 0%; background: var(--ink); }
  .knob {
    position: absolute; top: 50%; left: 0%;
    width: 12px; height: 12px; margin: -6px 0 0 -6px;
    border-radius: 50%; background: var(--ink);
    opacity: 0; transition: opacity .15s ease;
  }
  .progress:hover .knob, .progress:active .knob, .progress:focus-visible .knob { opacity: 1; }
  .progress:focus-visible { outline: none; }
</style>
</head>
<body>
<main>
  <h1>Philipp <span>60</span></h1>

  <div class="photo">
    <img src="philipp.jpg" alt="Philipp" width="1461" height="1162" decoding="async">
    <div class="slide" aria-hidden="true"><img alt="" decoding="async"></div>
    <div class="slide" aria-hidden="true"><img alt="" decoding="async"></div>
    <div class="slide info" id="info">
      <div class="label">Feier</div>
      <div class="date">Fr 29.01.27</div>
      <div class="time">19:30 Uhr</div>
      <div class="place"><a href="https://www.google.com/maps/search/?api=1&amp;query=Full+Moon+Bar+Schw%C3%A4bisch+Gm%C3%BCnd" target="_blank" rel="noopener">Full Moon Bar</a><br><span>Schwäbisch Gmünd</span></div>
    </div>
  </div>

  <section class="player" aria-label="Musikplayer">
    <div class="row">
      <button class="play" id="play" type="button" aria-label="Abspielen">
        <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M7 4.8v14.4a1 1 0 0 0 1.53.85l11.5-7.2a1 1 0 0 0 0-1.7L8.53 3.95A1 1 0 0 0 7 4.8z"/></svg>
        <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="4.5" width="4" height="15" rx="1" fill="currentColor"/><rect x="14" y="4.5" width="4" height="15" rx="1" fill="currentColor"/></svg>
      </button>
      <div class="track">
        <span class="title">What's My Age Again?</span>
        <span class="artist">blink-182</span>
      </div>
      <div class="times"><span id="cur">0:00</span> / <span id="dur">–:––</span></div>
    </div>

    <div class="progress" id="progress" role="slider" tabindex="0"
         aria-label="Wiedergabeposition" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="bar"><div class="fill" id="fill"></div><div class="knob" id="knob"></div></div>
    </div>

    <audio id="audio" src="lied.mp3" preload="metadata"></audio>
  </section>
</main>

<script>
(function () {
  var audio = document.getElementById('audio');
  var btn = document.getElementById('play');
  var prog = document.getElementById('progress');
  var fill = document.getElementById('fill');
  var knob = document.getElementById('knob');
  var cur = document.getElementById('cur');
  var dur = document.getElementById('dur');
  var dragging = false;

  function fmt(s) {
    if (!isFinite(s)) return '–:––';
    s = Math.max(0, Math.floor(s));
    return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  }
  function setPos(ratio) {
    var p = Math.min(1, Math.max(0, ratio)) * 100;
    fill.style.width = p + '%';
    knob.style.left = p + '%';
    prog.setAttribute('aria-valuenow', Math.round(p));
  }
  function render() {
    if (dragging) return;
    var d = audio.duration;
    setPos(d ? audio.currentTime / d : 0);
    cur.textContent = fmt(audio.currentTime);
    prog.setAttribute('aria-valuetext', fmt(audio.currentTime) + ' von ' + fmt(d));
  }
  function setPlaying(on) {
    btn.classList.toggle('is-playing', on);
    btn.setAttribute('aria-label', on ? 'Pause' : 'Abspielen');
  }

  btn.addEventListener('click', function () {
    if (audio.paused) {
      btn.classList.add('is-loading');
      var p = audio.play();
      if (p && p.catch) p.catch(function () { btn.classList.remove('is-loading'); setPlaying(false); });
    } else {
      audio.pause();
    }
  });

  audio.addEventListener('playing', function () { btn.classList.remove('is-loading'); setPlaying(true); });
  audio.addEventListener('pause', function () { setPlaying(false); });
  audio.addEventListener('ended', function () { setPlaying(false); render(); showSlide(SLIDE_COUNT); });
  audio.addEventListener('timeupdate', render);
  audio.addEventListener('loadedmetadata', function () { dur.textContent = fmt(audio.duration); render(); });
  audio.addEventListener('durationchange', function () { dur.textContent = fmt(audio.duration); });

  // Diashow: Bild-Index folgt der Liedposition (dia/01.jpg … dia/45.jpg),
  // die letzten INFO_SECONDS zeigen die Party-Infos
  var SLIDE_COUNT = 45, INFO_SECONDS = 14;
  var photoEls = document.querySelectorAll('.slide:not(.info)');
  var infoEl = document.getElementById('info');
  var shown = -1, front = 0, current = null, z = 1, cache = {};
  function slideSrc(i) { return 'dia/' + String(i + 1).padStart(2, '0') + '.jpg'; }
  function preload(i) {
    if (i < 0 || i >= SLIDE_COUNT || cache[i]) return;
    cache[i] = new Image(); cache[i].src = slideSrc(i);
  }
  function bringIn(el, i) {
    if (shown !== i) return;
    var prev = current;
    el.style.zIndex = ++z;
    el.classList.add('on');
    current = el;
    if (prev && prev !== el) setTimeout(function () { if (current !== prev) prev.classList.remove('on'); }, 1400);
  }
  function showSlide(i) {
    if (i === shown) return;
    shown = i;
    if (i < 0) {
      photoEls[0].classList.remove('on'); photoEls[1].classList.remove('on'); infoEl.classList.remove('on');
      current = null; return;
    }
    if (i >= SLIDE_COUNT) { bringIn(infoEl, i); return; }
    var next = photoEls[1 - front];
    if (next === current) next = photoEls[front];
    front = Array.prototype.indexOf.call(photoEls, next);
    var img = next.querySelector('img');
    next.classList.remove('on');
    img.onload = function () { bringIn(next, i); };
    img.src = slideSrc(i);
    if (img.complete && img.naturalWidth) bringIn(next, i);
    preload(i + 1); preload(i + 2);
  }
  function syncSlides() {
    var d = audio.duration, t = audio.currentTime;
    if (!d || (audio.paused && t === 0)) { showSlide(-1); return; }
    var photoEnd = d - INFO_SECONDS;
    showSlide(t >= photoEnd ? SLIDE_COUNT : Math.min(SLIDE_COUNT - 1, Math.floor(t / photoEnd * SLIDE_COUNT)));
  }
  audio.addEventListener('timeupdate', syncSlides);
  audio.addEventListener('seeked', syncSlides);
  audio.addEventListener('play', function () { preload(0); preload(1); });

  function ratioAt(e) {
    var r = prog.getBoundingClientRect();
    return (e.clientX - r.left) / r.width;
  }
  function seekTo(ratio) {
    if (!audio.duration) return;
    audio.currentTime = Math.min(1, Math.max(0, ratio)) * audio.duration;
  }
  prog.addEventListener('pointerdown', function (e) {
    if (!audio.duration) return;
    dragging = true;
    prog.setPointerCapture(e.pointerId);
    var r = ratioAt(e); setPos(r); cur.textContent = fmt(r * audio.duration);
  });
  prog.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    var r = Math.min(1, Math.max(0, ratioAt(e)));
    setPos(r); cur.textContent = fmt(r * audio.duration);
  });
  function endDrag(e) {
    if (!dragging) return;
    dragging = false;
    seekTo(ratioAt(e));
  }
  prog.addEventListener('pointerup', endDrag);
  prog.addEventListener('pointercancel', function () { dragging = false; render(); });
  prog.addEventListener('keydown', function (e) {
    if (!audio.duration) return;
    var step = { ArrowRight: 5, ArrowUp: 5, ArrowLeft: -5, ArrowDown: -5 }[e.key];
    if (step) { e.preventDefault(); audio.currentTime = Math.min(audio.duration, Math.max(0, audio.currentTime + step)); }
  });

  // Autoplay versuchen – klappt meist nicht (v. a. iOS), dann bleibt der Button
  var tryAuto = audio.play();
  if (tryAuto && tryAuto.catch) tryAuto.catch(function () { setPlaying(false); });
})();
</script>
</body>
</html>
